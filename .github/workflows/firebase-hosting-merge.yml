# Deploys https://padel-galaxy-1c7a2.web.app on push to main.
# Firestore rules/indexes are NOT touched here — deploy them locally with
# `npm run deploy-rules` (or `firebase deploy --only firestore`) when they
# change. The CI service account doesn't have firestore admin roles.

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build stamp is `git rev-list --count HEAD`,
          # and checkout's default shallow clone would make every CI build
          # report build 1.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Firebase web config is public by design (it ships in the client
      # bundle); kept in GH secrets only to avoid hard-coding repo-wide
      # constants. Vite bakes these into the build at compile time.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PADEL_GALAXY_1C7A2 }}
          channelId: live
          projectId: padel-galaxy-1c7a2
