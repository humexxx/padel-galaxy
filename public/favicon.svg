<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Padel Galaxy favicon: a planet-with-ring (the padel ball orbited
       by a galaxy ring) on a rounded badge. Auto-adapts to the OS
       color scheme — the badge + ring flip between light/dark, while
       the ball stays emerald as the brand accent. Mirrors the
       allstars-galaxy / trim-success shape language (32px badge,
       rx=7, prefers-color-scheme media query). -->
  <style>
    .bg { fill: #fafafa; }
    .ring { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0a0a0a; }
      .ring { stroke: #fafafa; }
    }
  </style>

  <!-- Badge -->
  <rect class="bg" width="32" height="32" rx="7" />

  <!-- Orbit / galaxy ring — tilted ellipse around the ball -->
  <ellipse
    class="ring"
    cx="16"
    cy="16"
    rx="12"
    ry="4.2"
    fill="none"
    stroke-width="1.8"
    stroke-linecap="round"
    opacity="0.6"
    transform="rotate(-22 16 16)"
  />

  <!-- Padel ball (emerald — brand accent, stays constant across themes) -->
  <circle fill="#10b981" cx="16" cy="16" r="5.4" />
</svg>
