<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Padel Galaxy">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#2a1466" />
      <stop offset="45%" stop-color="#160a3d" />
      <stop offset="100%" stop-color="#05021a" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#5b21b6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#5b21b6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#be185d" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#0e7490" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ball" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#f0ffd0" />
      <stop offset="40%" stop-color="#d4ff4d" />
      <stop offset="80%" stop-color="#7bb800" />
      <stop offset="100%" stop-color="#3f6300" />
    </radialGradient>

    <radialGradient id="ballGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4ff4d" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#a3e635" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="racquetFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>

    <linearGradient id="racquetHandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f0a2e" />
    </linearGradient>

    <pattern id="strings" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 0 L6 0 M0 0 L0 6" stroke="#e9d5ff" stroke-width="0.6" stroke-opacity="0.55" />
    </pattern>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="1200" fill="url(#sky)" />

  <!-- Nebulae -->
  <ellipse cx="180" cy="220" rx="320" ry="220" fill="url(#nebulaPurple)" />
  <ellipse cx="650" cy="380" rx="280" ry="200" fill="url(#nebulaPink)" />
  <ellipse cx="500" cy="980" rx="380" ry="240" fill="url(#nebulaPurple)" opacity="0.8" />
  <ellipse cx="120" cy="820" rx="220" ry="180" fill="url(#nebulaTeal)" />

  <!-- Milky way streak -->
  <g opacity="0.35" transform="rotate(-18 400 600)">
    <ellipse cx="400" cy="600" rx="520" ry="40" fill="#c4b5fd" filter="url(#soft)" />
    <ellipse cx="400" cy="600" rx="420" ry="22" fill="#f5d0fe" filter="url(#soft)" />
  </g>

  <!-- Distant stars (small) -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="0.8" opacity="0.7" />
    <circle cx="90" cy="140" r="0.6" opacity="0.5" />
    <circle cx="160" cy="80" r="1.0" opacity="0.9" />
    <circle cx="240" cy="50" r="0.7" opacity="0.6" />
    <circle cx="320" cy="120" r="0.5" opacity="0.5" />
    <circle cx="420" cy="40" r="0.9" opacity="0.8" />
    <circle cx="500" cy="160" r="0.6" opacity="0.6" />
    <circle cx="580" cy="70" r="1.1" opacity="0.9" />
    <circle cx="660" cy="180" r="0.7" opacity="0.7" />
    <circle cx="740" cy="100" r="0.8" opacity="0.7" />
    <circle cx="60" cy="260" r="0.7" opacity="0.6" />
    <circle cx="200" cy="300" r="0.5" opacity="0.5" />
    <circle cx="360" cy="240" r="0.9" opacity="0.8" />
    <circle cx="480" cy="320" r="0.6" opacity="0.5" />
    <circle cx="620" cy="280" r="0.8" opacity="0.7" />
    <circle cx="760" cy="340" r="0.7" opacity="0.6" />
    <circle cx="30" cy="420" r="0.6" opacity="0.5" />
    <circle cx="150" cy="480" r="0.9" opacity="0.8" />
    <circle cx="280" cy="440" r="0.5" opacity="0.4" />
    <circle cx="540" cy="500" r="0.7" opacity="0.6" />
    <circle cx="700" cy="460" r="1.0" opacity="0.9" />
    <circle cx="80" cy="620" r="0.6" opacity="0.5" />
    <circle cx="220" cy="700" r="0.8" opacity="0.7" />
    <circle cx="380" cy="660" r="0.5" opacity="0.5" />
    <circle cx="520" cy="720" r="0.9" opacity="0.8" />
    <circle cx="680" cy="640" r="0.6" opacity="0.6" />
    <circle cx="60" cy="900" r="0.7" opacity="0.6" />
    <circle cx="180" cy="960" r="1.0" opacity="0.9" />
    <circle cx="320" cy="880" r="0.5" opacity="0.4" />
    <circle cx="460" cy="940" r="0.8" opacity="0.7" />
    <circle cx="600" cy="900" r="0.6" opacity="0.5" />
    <circle cx="740" cy="980" r="0.9" opacity="0.8" />
    <circle cx="100" cy="1100" r="0.6" opacity="0.6" />
    <circle cx="260" cy="1060" r="0.8" opacity="0.7" />
    <circle cx="420" cy="1140" r="0.5" opacity="0.5" />
    <circle cx="580" cy="1080" r="1.0" opacity="0.9" />
    <circle cx="720" cy="1150" r="0.6" opacity="0.5" />
  </g>

  <!-- Brighter stars with glow -->
  <g filter="url(#glow)">
    <circle cx="120" cy="160" r="1.6" fill="#ffffff" />
    <circle cx="540" cy="220" r="1.8" fill="#fde68a" />
    <circle cx="700" cy="540" r="1.5" fill="#a5f3fc" />
    <circle cx="260" cy="540" r="1.7" fill="#ffffff" />
    <circle cx="640" cy="820" r="1.9" fill="#fbcfe8" />
    <circle cx="160" cy="1040" r="1.6" fill="#ffffff" />
    <circle cx="480" cy="60" r="1.4" fill="#e9d5ff" />
  </g>

  <!-- Sparkle stars (4-point) -->
  <g fill="#ffffff" opacity="0.95">
    <g transform="translate(330 180)">
      <path d="M0 -10 L1.4 -1.4 L10 0 L1.4 1.4 L0 10 L-1.4 1.4 L-10 0 L-1.4 -1.4 Z" />
    </g>
    <g transform="translate(610 660)" opacity="0.85">
      <path d="M0 -8 L1.1 -1.1 L8 0 L1.1 1.1 L0 8 L-1.1 1.1 L-8 0 L-1.1 -1.1 Z" />
    </g>
    <g transform="translate(90 740)" opacity="0.8">
      <path d="M0 -6 L0.9 -0.9 L6 0 L0.9 0.9 L0 6 L-0.9 0.9 L-6 0 L-0.9 -0.9 Z" />
    </g>
    <g transform="translate(720 280)" opacity="0.9">
      <path d="M0 -7 L1 -1 L7 0 L1 1 L0 7 L-1 1 L-7 0 L-1 -1 Z" />
    </g>
  </g>

  <!-- Shooting star -->
  <g opacity="0.85">
    <line x1="80" y1="380" x2="280" y2="240" stroke="url(#racquetFrame)" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <circle cx="280" cy="240" r="2.5" fill="#ffffff" filter="url(#glow)" />
  </g>

  <!-- Planet rings around the ball -->
  <g transform="translate(420 560)">
    <!-- Outer dashed orbit -->
    <ellipse cx="0" cy="0" rx="260" ry="70" fill="none" stroke="#c4b5fd" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="3 6" transform="rotate(-20)" />
    <!-- Inner orbit (behind ball) -->
    <path d="M -210 0 A 210 56 0 0 1 210 0" fill="none" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2" transform="rotate(-20)" />

    <!-- Ball glow -->
    <circle cx="0" cy="0" r="180" fill="url(#ballGlow)" />

    <!-- The ball (planet) -->
    <g>
      <circle cx="0" cy="0" r="120" fill="url(#ball)" />
      <!-- Padel ball seams -->
      <path d="M -118 -18 Q 0 -90 118 -18" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" />
      <path d="M -118 18 Q 0 90 118 18" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="2.5" stroke-linecap="round" />
      <!-- Highlight -->
      <ellipse cx="-38" cy="-44" rx="34" ry="22" fill="#ffffff" opacity="0.35" />
      <ellipse cx="-50" cy="-58" rx="10" ry="6" fill="#ffffff" opacity="0.7" />
    </g>

    <!-- Front half of inner orbit (in front of ball) -->
    <path d="M -210 0 A 210 56 0 0 0 210 0" fill="none" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2" transform="rotate(-20)" />

    <!-- Small moon -->
    <g transform="rotate(-20) translate(210 0) rotate(20)">
      <circle cx="0" cy="0" r="6" fill="#e9d5ff" />
      <circle cx="-2" cy="-2" r="2" fill="#ffffff" opacity="0.8" />
    </g>
  </g>

  <!-- Padel racquet floating like a satellite -->
  <g transform="translate(560 280) rotate(28)">
    <!-- Handle -->
    <rect x="-7" y="60" width="14" height="78" rx="5" fill="url(#racquetHandle)" />
    <rect x="-6" y="62" width="12" height="76" rx="4" fill="none" stroke="#e9d5ff" stroke-opacity="0.25" />
    <!-- Grip wraps -->
    <g stroke="#e9d5ff" stroke-opacity="0.3" stroke-width="0.8">
      <line x1="-7" y1="74" x2="7" y2="80" />
      <line x1="-7" y1="86" x2="7" y2="92" />
      <line x1="-7" y1="98" x2="7" y2="104" />
      <line x1="-7" y1="110" x2="7" y2="116" />
      <line x1="-7" y1="122" x2="7" y2="128" />
    </g>
    <!-- Neck -->
    <path d="M -10 60 Q 0 48 10 60 Z" fill="url(#racquetHandle)" />
    <!-- Frame outer -->
    <ellipse cx="0" cy="0" rx="62" ry="68" fill="url(#racquetFrame)" />
    <!-- Frame inner cutout -->
    <ellipse cx="0" cy="-2" rx="50" ry="56" fill="#0f0a2e" />
    <!-- Strings -->
    <ellipse cx="0" cy="-2" rx="50" ry="56" fill="url(#strings)" />
    <!-- Holes pattern (dots) -->
    <g fill="#e9d5ff" opacity="0.55">
      <circle cx="-30" cy="-30" r="1.6" />
      <circle cx="-15" cy="-35" r="1.6" />
      <circle cx="0" cy="-38" r="1.6" />
      <circle cx="15" cy="-35" r="1.6" />
      <circle cx="30" cy="-30" r="1.6" />
      <circle cx="-35" cy="-10" r="1.6" />
      <circle cx="35" cy="-10" r="1.6" />
      <circle cx="-38" cy="10" r="1.6" />
      <circle cx="38" cy="10" r="1.6" />
      <circle cx="-30" cy="28" r="1.6" />
      <circle cx="30" cy="28" r="1.6" />
      <circle cx="0" cy="38" r="1.6" />
    </g>
    <!-- Highlight on frame -->
    <path d="M -50 -38 Q 0 -78 50 -38" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Court silhouette at the bottom (horizon) -->
  <g opacity="0.55" transform="translate(0 980)">
    <!-- ground gradient overlay -->
    <rect x="0" y="0" width="800" height="220" fill="#0a0524" opacity="0.6" />
    <!-- court perspective -->
    <g stroke="#a78bfa" stroke-opacity="0.7" fill="none" stroke-width="1.4">
      <!-- outer rectangle in perspective -->
      <path d="M 120 200 L 260 50 L 540 50 L 680 200 Z" />
      <!-- service line -->
      <path d="M 200 110 L 600 110" />
      <!-- center line -->
      <path d="M 400 110 L 400 200" />
      <!-- net -->
      <path d="M 175 155 L 625 155" stroke-dasharray="2 3" />
    </g>
    <!-- court glow -->
    <path d="M 120 200 L 260 50 L 540 50 L 680 200 Z" fill="#7c3aed" opacity="0.08" />
  </g>
</svg>
