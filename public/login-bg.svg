<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Padel Galaxy">
  <defs>
    <radialGradient id="space" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2b1a4a"/>
      <stop offset="45%" stop-color="#160a30"/>
      <stop offset="100%" stop-color="#06030f"/>
    </radialGradient>
    <radialGradient id="neb1" cx="30%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#1e7d4a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="75%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3b1a8e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="paddle" cx="50%" cy="42%" r="40%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.95"/>
    </radialGradient>
    <radialGradient id="ball" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#bef264"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1600" fill="url(#space)"/>
  <rect width="1200" height="1600" fill="url(#neb1)"/>
  <rect width="1200" height="1600" fill="url(#neb2)"/>

  <g fill="#ffffff">
