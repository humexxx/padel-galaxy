    <circle cx="180" cy="260" r="0.8" opacity="0.7"/>
    <circle cx="320" cy="80" r="1.6" opacity="0.85"/>
    <circle cx="480" cy="220" r="0.7" opacity="0.6"/>
    <circle cx="640" cy="140" r="1.1" opacity="0.8"/>
    <circle cx="820" cy="60" r="0.9" opacity="0.7"/>
    <circle cx="980" cy="200" r="1.4" opacity="0.85"/>
    <circle cx="1120" cy="320" r="0.8" opacity="0.6"/>
    <circle cx="60" cy="500" r="1.0" opacity="0.7"/>
    <circle cx="240" cy="620" r="0.9" opacity="0.65"/>
    <circle cx="900" cy="500" r="1.3" opacity="0.85"/>
    <circle cx="1080" cy="700" r="0.9" opacity="0.7"/>
    <circle cx="160" cy="900" r="1.1" opacity="0.8"/>
    <circle cx="380" cy="1080" r="0.8" opacity="0.65"/>
    <circle cx="720" cy="1180" r="1.4" opacity="0.85"/>
    <circle cx="980" cy="1300" r="0.9" opacity="0.7"/>
