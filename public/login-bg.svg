      <g stroke="#0f172a" stroke-width="3" fill="none" opacity="0.65">
        <line x1="-160" y1="-180" x2="160" y2="180"/>
        <line x1="160" y1="-180" x2="-160" y2="180"/>
        <line x1="-200" y1="0" x2="200" y2="0"/>
        <line x1="0" y1="-240" x2="0" y2="240"/>
        <polygon points="-160,-180 160,-180 200,0 160,180 -160,180 -200,0"/>
      </g>
      <rect x="-22" y="240" width="44" height="120" rx="10" fill="#1e3a8a"/>
      <circle cx="-160" cy="-220" r="50" fill="url(#ball)"/>
      <circle cx="-160" cy="-220" r="50" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.5"/>
      <path d="M -200 -220 Q -160 -180 -120 -220" stroke="#ffffff" stroke-opacity="0.45" stroke-width="2" fill="none"/>
